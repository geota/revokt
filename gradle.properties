# Build performance and reproducibility (CONTRIBUTING §3 "Toolchain").
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# JDKs come from the environment (actions/setup-java in CI, a local install at home); never auto-provisioned.
org.gradle.java.installations.auto-download=false

# Kotlin
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
kotlin.native.ignoreDisabledTargets=true

# Flags (CONTRIBUTING §6 "The local gate"):
#   -Prevokt.ci          adds the Android modules (from 0.3), the consumer builds and the purity compile
#   -Prevokt.purityGate  enables the linuxX64 target on revokt-engine / revokt-clubcard (compile only)
#   -Prevokt.native      includes revokt-engine-upki (JDK 22) and the native builds
