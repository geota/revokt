# Build performance and reproducibility (CONTRIBUTING §3 "Toolchain").
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Repository retries (#257, #275). Gradle retries a 408, a 429, a 5xx or a dropped connection; the defaults (3 attempts,
# 1 s first backoff, doubling) gave up on Maven Central's rate limit within about 3 s. Five attempts from 5 s wait
# 5, 10, 20 and 40 s, about 75 s at most per request. Internal Gradle properties: dependency resolution reads the
# repository.* pair, publishing the network.retry.* pair.
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=5000
systemProp.org.gradle.internal.network.retry.max.attempts=5
systemProp.org.gradle.internal.network.retry.initial.backOff=5000

# JDKs come from the environment (actions/setup-java in CI, a local install at home); never auto-provisioned.
org.gradle.java.installations.auto-download=false

# Kotlin
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
kotlin.native.ignoreDisabledTargets=true

# The version being developed: its major.minor is the current minor for the Rule fixture's growability check (#73).
# Bump the minor when the next milestone opens (CONTRIBUTING §9); a release passes -Prevokt.version.
revokt.version=0.1.0-SNAPSHOT

# Flags (CONTRIBUTING §6 "The local gate"):
#   -Prevokt.ci          adds the Android modules (from 0.3), the consumer builds and the purity compile
#   -Prevokt.purityGate  enables the linuxX64 target on revokt-engine / revokt-clubcard (compile only)
#   -Prevokt.native      includes revokt-engine-upki (JDK 22) and the native builds
