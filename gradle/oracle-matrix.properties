#
# The §9.2 version matrix (CONTRIBUTING §6): the JDKs the replay runs on, the JDK early-access release the nightly
# replays against, and the Conscrypt uber versions, named by their gradle/libs.versions.toml keys (versions live only in
# the catalog, CONTRIBUTING §3). Roll rule: add the new version and keep the old until its support ends, except that the
# bytecode target (17) stays while it is the target. `verifyOracleMatrix` checks ci.yml and nightly.yml against it.
# jdk.ea is rolled by hand: once that release reaches GA, jdk.java.net drops its EA builds and the nightly fails until it
# is rolled. From 0.3 the Android system images join the matrix here, by revision.
# upki and upki-revocation pin the second engine (spec §3.2, Appendix A): the rustls/upki git tag of its latest GitHub
# release (crates.io lags it) and the C2SP upki-revocation/* tag the C2SP reader conforms to, with the commit that tag
# points at. The nightly upki-release job fails when either has a newer release or the tag moves; admitting one is a spec
# change (re-verify Appendix A, roll the pin, re-record the index golden with native/revokt-oracle/record-upki-index.sh,
# which builds upki at this pin, and re-run the cross-engine suite). verifyOracleMatrix checks the golden names the pin.
jdk=17,21,25,27
jdk.ea=28
conscrypt=conscrypt,conscrypt-previous
upki=v1.0.1
upki-revocation=v1.0.0
upki-revocation.commit=7e6ded4bea8d845c5d269cd1bf1f182348962bbe
