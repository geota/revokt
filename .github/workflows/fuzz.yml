#
# Manual fuzzing on the self-hosted `revokt-fuzz` runner (spec §9.1, CONTRIBUTING §6; decision CI1, #115): every
# Jazzer @FuzzTest method in turn, for the chosen time each. Built but disabled: it runs only when a maintainer
# dispatches it. Never on pull_request or pull_request_target: a self-hosted runner on a public repository must not
# run a fork's code. No ClusterFuzzLite, no corpus token, no secret. Not the release gate (that is #119).
name: fuzz

on:
  # Off until the maintainer registers the revokt-fuzz runner and turns the nightly run on by uncommenting this.
  # schedule:
  #   - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "all, or one target as Class.method (the discovery step lists them)"
        type: string
        default: all
      seconds:
        description: "Fuzzing time per target, in seconds (1 to 3600)"
        type: number
        default: 300

permissions: read-all

# One runner: a second dispatch waits for the first instead of cancelling it.
concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz (every @FuzzTest target in turn)
    runs-on: [self-hosted, revokt-fuzz] # zizmor: ignore[self-hosted-runner] dispatch only, never a PR trigger
    timeout-minutes: 600
    permissions:
      contents: read
    steps:
      # Without the StepSecurity agent on the runner this only logs; kept so every job starts the same way.
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      # The runner keeps its own ~/.gradle; nothing is written to the Actions cache.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      # Discovery: every @FuzzTest method under */src/jvmTest/kotlin, so a new target needs no edit here. Its flags are
      # the §9.1 harness's: -rss_limit_mb=1024, -timeout=10 unless the target's source names another (the parser's
      # -timeout=1), and the -max_len=<cap + 1> its source names. Jazzer's JUnit mode reads libFuzzer flags from the
      # jazzer.internal.arg.<n> configuration parameters, which reach the test JVM as system properties; they come
      # after Jazzer's own (-rss_limit_mb=0, -max_total_time from maxDuration), and libFuzzer keeps the last. The test
      # JVM keeps Gradle's 512 MiB heap: §9.1's -Xmx256m needs a build change, which #115 leaves open.
      - name: fuzz
        env:
          TARGET: ${{ inputs.target || 'all' }}
          FUZZ_SECONDS: ${{ inputs.seconds || 300 }}
        run: |
          set -euo pipefail
          case $FUZZ_SECONDS in ''|*[!0-9]*) echo "::error::seconds must be a whole number"; exit 1 ;; esac
          if [ "$FUZZ_SECONDS" -lt 1 ] || [ "$FUZZ_SECONDS" -gt 3600 ]; then echo "::error::seconds must be 1 to 3600"; exit 1; fi
          case $TARGET in ''|*[!A-Za-z0-9_.]*) echo "::error::target must be all or Class.method"; exit 1 ;; esac
          # One line per target: <module> <package.Class> <method> <file>.
          targets=$({ git grep -l -E '^[[:space:]]*@FuzzTest' -- '*/src/jvmTest/kotlin/*.kt' || true; } | while read -r file; do
            pkg=$(sed -n 's/^package \([A-Za-z0-9_.]*\)$/\1/p' "$file")
            awk -v module="${file%%/*}" -v pkg="$pkg" -v file="$file" '
              /^(internal |public )?class [A-Za-z0-9_]+/ { cls = $0; sub(/^(internal |public )?class /, "", cls); sub(/[^A-Za-z0-9_].*/, "", cls) }
              /^[[:space:]]*@FuzzTest/ { want = 1; next }
              want && /fun / { m = $0; sub(/.*fun /, "", m); sub(/\(.*/, "", m); print module, pkg "." cls, m, file; want = 0 }
            ' "$file"
          done)
          if [ -z "$targets" ]; then echo "::error::no @FuzzTest method found"; exit 1; fi
          echo "Targets:"; printf '%s\n' "$targets" | sed 's/^/  /'
          mkdir -p fuzz-out
          ran=0
          failed=()
          while read -r module cls method file; do
            name="${cls##*.}.$method"
            if [ "$TARGET" != all ] && [ "$TARGET" != "$name" ]; then continue; fi
            ran=$((ran + 1))
            maxlen=$({ grep -o -e '-max_len=[0-9]*' "$file" || true; } | sort -u | sed 's/-max_len=//')
            timeout=$({ grep -o -e '-timeout=[0-9]*' "$file" || true; } | sort -u | sed 's/-timeout=//')
            if [ "$(printf '%s' "$maxlen" | grep -c .)" -gt 1 ] || [ "$(printf '%s' "$timeout" | grep -c .)" -gt 1 ]; then
              echo "::error file=$file::$name: its source names more than one -max_len or -timeout"; failed+=("$name"); continue
            fi
            if [ -z "$maxlen" ]; then echo "::warning file=$file::$name: its source names no -max_len (spec §9.1: the cap + 1); libFuzzer's default applies"; fi
            args=(fake_argv0 "-max_total_time=$FUZZ_SECONDS" -rss_limit_mb=1024 "-timeout=${timeout:-10}")
            if [ -n "$maxlen" ]; then args+=("-max_len=$maxlen"); fi
            opts=""
            for i in "${!args[@]}"; do opts+=" -Djazzer.internal.arg.$i=${args[$i]}"; done
            echo "::group::$name (${args[*]:1})"
            out="fuzz-out/$name"
            mkdir -p "$out"
            status=0
            JAZZER_FUZZ=1 JAVA_TOOL_OPTIONS="${opts# }" \
              ./gradlew ":$module:jvmTest" --tests "$cls.$method" --rerun --no-daemon < /dev/null 2>&1 | tee "$out/gradle.log" || status=$?
            # Jazzer writes a finding (crash-, timeout-, oom-, leak-, slow-unit-) into the module directory, as these
            # targets keep their inputs under src/jvmTest/resources and not src/test/resources.
            find "$module" -maxdepth 1 -type f \( -name 'crash-*' -o -name 'timeout-*' -o -name 'oom-*' -o -name 'leak-*' -o -name 'slow-unit-*' \) -exec mv {} "$out/" \;
            cp "$module/build/test-results/jvmTest/"*.xml "$out/" 2>/dev/null || true
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then echo "::error file=$file::$name failed; see the fuzz-findings artifact"; failed+=("$name"); fi
          done <<< "$targets"
          if [ "$ran" -eq 0 ]; then echo "::error::no target named '$TARGET'"; exit 1; fi
          if [ "${#failed[@]}" -gt 0 ]; then echo "::error::failed: ${failed[*]}"; exit 1; fi
      # The reproducers and logs only; they are public on a public repository, so a finding is triaged as a
      # vulnerability report (SECURITY.md) and its fix follows CONTRIBUTING §8.
      - name: findings on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ github.run_id }}-${{ github.run_attempt }}
          path: fuzz-out/
          if-no-files-found: ignore
          retention-days: 7
