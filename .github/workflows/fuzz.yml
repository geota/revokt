# SPDX-License-Identifier: Apache-2.0
#
# Fuzzing (spec §9.1, CONTRIBUTING §6; #115, #213): one matrix entry per Jazzer @FuzzTest method, as `./gradlew
# fuzzTargets` discovers them, for the chosen time each, on GitHub-hosted runners: nightly for 300 s a target (the
# nightly fuzzing tier, in place of ClusterFuzzLite until OSS-Fuzz, #119), and when a maintainer dispatches it; never
# on pull_request or pull_request_target. The fuzz job holds no secret: a finding is
# minimised, sealed with age (ASCII armour) to the FUZZ_AGE_RECIPIENT repository variable, and uploaded with a manifest
# as a 7-day artifact. The advisory job, on a fresh runner with FUZZ_ADVISORY_TOKEN and none of the fuzzed tree, checks
# that artifact as hostile data and files one private draft security advisory per new finding, the ciphertext inline
# (CONTRIBUTING §6). No reproducer, stack trace or fuzzer log reaches a job log, artifact or advisory in the clear. The
# corpus job, on another fresh runner with CFL_CORPUS_TOKEN and none of the fuzzed tree, takes each target's generated
# corpus as data, validates it and adds it to the private geota/revokt-fuzz-corpus repository. The seed job (#265), on a
# fresh runner with the read-only CFL_CORPUS_READ_TOKEN, reads that repository back and hands it to the fuzz job as an
# artifact, which the fuzz job checks before use; without the secret every target starts from its committed inputs.
# Weekly, the prune (#265) runs instead of fuzzing: the merge job, secret-free, merges each target's corpus with
# libFuzzer's -merge=1 into a fresh directory, and the prune job, with CFL_CORPUS_TOKEN and none of the fuzzed tree,
# replaces the target's directory in the repository with the result.
name: fuzz

on:
  # The nightly fuzzing tier (#213): every target for 300 s, with the generated corpus pushed to the corpus repository.
  schedule:
    - cron: "47 3 * * *"
    # The weekly prune (#265): merge and prune the corpus repository, without fuzzing. The targets job names this cron.
    - cron: "17 9 * * 0"
  workflow_dispatch:
    inputs:
      target:
        description: "all, or one target as Class.method (the targets job lists them)"
        type: string
        default: all
      seconds:
        description: "Fuzzing time per target, in seconds (1 to 3600)"
        type: number
        default: 300
      upload_corpus:
        description: "Upload each target's generated corpus (7 days; the account is near its storage budget)"
        type: boolean
        default: false
      prune:
        description: "Merge and prune the corpus repository (-merge=1) instead of fuzzing; main only"
        type: boolean
        default: false

permissions: read-all

# One run at a time, so two runs never race to record the same finding. A concurrency group holds one running and one
# pending run: a second dispatch waits for the first, and a third replaces the pending second.
concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  targets:
    name: targets (the @FuzzTest methods)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.list.outputs.targets }}
      mode: ${{ steps.list.outputs.mode }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}   # saved from main, read elsewhere (#262)
          cache-cleanup: never   # as in ci.yml's check (#275)
      # build-logic's FuzzTargets: each method with the -max_len (the cap + 1) and -timeout its source names.
      - name: list
        id: list
        env:
          TARGET: ${{ inputs.target || 'all' }}
          SCHEDULE: ${{ github.event.schedule }}
          PRUNE: ${{ inputs.prune }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case $TARGET in ''|*[!A-Za-z0-9_.]*) echo "::error::target must be all or Class.method"; exit 1 ;; esac
          # fuzz, or prune: the weekly cron above, or a dispatch with prune, which reads and writes the corpus
          # repository and so runs for main only.
          mode=fuzz
          if [ "$SCHEDULE" = "17 9 * * 0" ] || [ "$PRUNE" = "true" ]; then mode=prune; fi
          if [ "$mode" = prune ] && [ "$REF" != refs/heads/main ]; then echo "::error::the prune runs for main only"; exit 1; fi
          # The build's lines (fuzzTargets prints each target) are not workflow commands: the runner ignores commands
          # until the random end token.
          stop=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
          echo "::stop-commands::$stop"
          status=0
          ./gradlew fuzzTargets --no-daemon || status=$?
          echo "::$stop::"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          targets=$(jq -c --arg t "$TARGET" '[.[] | select($t == "all" or .name == $t)]' build/fuzz/targets.json)
          if [ "$targets" = "[]" ]; then echo "::error::no target named $TARGET (see the fuzzTargets output above)"; exit 1; fi
          # The fuzz job echoes each target's name and source into workflow commands (::warning, ::error), so both may
          # hold only [A-Za-z0-9._/-]; \A and \z anchor the whole string, so no line break gets through. The values
          # themselves are not printed.
          if ! jq -e 'all(.[]; all(.name, .source; type == "string" and test("\\A[A-Za-z0-9._/-]+\\z")))' <<< "$targets" > /dev/null; then
            echo "::error::a target's name or source has a character outside [A-Za-z0-9._/-]; nothing is fuzzed"
            exit 1
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  # The corpus read (#265), on a fresh runner that never checks out, builds or runs anything of the repository but
  # fuzz_corpus.py, fetched alone at github.sha. Only this job holds CFL_CORPUS_READ_TOKEN (contents read on
  # geota/revokt-fuzz-corpus only), in the fuzz-corpus environment (main only), through a credential helper that reads it
  # from the environment. It clones the repository, stages each current target's units as data (fuzz_corpus.py stage:
  # regular files named by their SHA-1, within the target's -max_len and the seed caps) and uploads them as the 1-day
  # artifact fuzz-seed, <Class>-<method>/<unit>. Without the secret it stages nothing, with a notice, and the run goes on
  # from the committed inputs; in a prune run, a missing secret or a failed upload fails the job instead, as the prune
  # then has nothing to merge. units is the number uploaded (0 when nothing was), commit the repository's commit read,
  # and over_caps is true when the prune had to leave a target out (over its caps, or every unit over its -max_len). The
  # token-holding jobs block egress beyond GitHub's hosts.
  seed:
    name: seed (read the private corpus repository)
    needs: targets
    if: github.ref == 'refs/heads/main'
    environment: fuzz-corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      units: ${{ steps.result.outputs.units }}
      commit: ${{ steps.fetch.outputs.commit }}
      over_caps: ${{ steps.stage.outputs.over_caps }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block   # a token-holding job: GitHub's git, API and artifact hosts only
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/fuzz_corpus.py
          sparse-checkout-cone-mode: false
          path: corpus-script
      - name: fetch geota/revokt-fuzz-corpus
        id: fetch
        env:
          CFL_CORPUS_READ_TOKEN: ${{ secrets.CFL_CORPUS_READ_TOKEN }}
          MODE: ${{ needs.targets.outputs.mode }}
        run: |
          set -euo pipefail
          if [ -z "$CFL_CORPUS_READ_TOKEN" ]; then
            # A prune run without the seed has nothing to merge: it fails, so a skipped prune is never green (#280).
            if [ "$MODE" = prune ]; then
              echo "::error::the fuzz-corpus environment has no CFL_CORPUS_READ_TOKEN (CONTRIBUTING §6); the corpus repository is not pruned"
              exit 1
            fi
            echo "::notice::the fuzz-corpus environment has no CFL_CORPUS_READ_TOKEN (CONTRIBUTING §6); every target starts from its committed inputs"
            exit 0
          fi
          # The helper prints the token from the environment; the token itself is in no argument. It answers for
          # https://github.com only, and with git-lfs's downloads and hooks off nothing else is asked.
          # shellcheck disable=SC2016 # expanded by the helper's shell, not here
          helper='!f() { echo username=x-access-token; echo "password=$CFL_CORPUS_READ_TOKEN"; }; f'
          repo=$RUNNER_TEMP/corpus-repo
          GIT_LFS_SKIP_SMUDGE=1 git -c core.hooksPath=/dev/null -c credential.https://github.com.helper="$helper" \
            clone --quiet --depth 1 https://github.com/geota/revokt-fuzz-corpus.git "$repo"
          commit=$(git -C "$repo" rev-parse HEAD)
          echo "read geota/revokt-fuzz-corpus at $commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: stage the corpus as data
        id: stage
        if: steps.fetch.outputs.commit != ''
        env:
          TARGETS: ${{ needs.targets.outputs.targets }}
          MODE: ${{ needs.targets.outputs.mode }}
          SCRIPT: ${{ github.workspace }}/corpus-script/.github/scripts/fuzz_corpus.py
        run: |
          set -euo pipefail
          staged=$RUNNER_TEMP/seed
          # The prune reads under its own, higher caps, so a target that outgrew the seed's is still merged. A target
          # over even those, or with every unit over its -max_len (exit 3), is left out with an error, and the prune job
          # fails the run once the rest is pruned.
          flags=()
          if [ "$MODE" = prune ]; then flags=(--prune); fi
          status=0
          /usr/bin/env -i PATH=/usr/bin:/bin TARGETS="$TARGETS" /usr/bin/python3 -I "$SCRIPT" stage "${flags[@]}" \
            "$RUNNER_TEMP/corpus-repo/corpus" "$staged" || status=$?
          if [ "$status" -eq 3 ]; then echo "over_caps=true" >> "$GITHUB_OUTPUT"; elif [ "$status" -ne 0 ]; then exit "$status"; fi
          echo "units=$(find "$staged" -type f | wc -l)" >> "$GITHUB_OUTPUT"
      # An upload the account's storage quota refuses does not fail a nightly: units is then 0, and nothing is seeded. In a
      # prune run it fails the job, as the prune then has nothing to merge (#280); the merge and prune jobs are skipped.
      - name: upload the seed
        id: upload
        if: steps.stage.outputs.units != '' && steps.stage.outputs.units != '0'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-seed
          path: ${{ runner.temp }}/seed/
          if-no-files-found: error
          retention-days: 1
      - name: result
        id: result
        env:
          STAGED_UNITS: ${{ steps.stage.outputs.units }}
          UPLOAD: ${{ steps.upload.outcome }}
          MODE: ${{ needs.targets.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$UPLOAD" = failure ] && [ "$MODE" = prune ]; then
            echo "::error::the fuzz-seed upload failed (the storage quota?); the corpus repository is not pruned"
            exit 1
          fi
          if [ "$UPLOAD" = success ]; then units=$STAGED_UNITS; else units=0; fi
          if [ "$UPLOAD" = failure ]; then echo "::warning::the fuzz-seed upload failed (the storage quota?); nothing is seeded"; fi
          echo "units=$units" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz (${{ matrix.target.name }})
    needs: [targets, seed]
    # The seed job may fail or be skipped (not main): the targets then start from their committed inputs.
    if: ${{ !cancelled() && needs.targets.result == 'success' && needs.targets.outputs.mode == 'fuzz' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Spec §9.1 "Tiers and matrix": fuzzing runs on one pinned JDK >= 22 (Panama), 25 here; Gradle runs on 21.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}   # saved from main, read elsewhere (#262)
          cache-cleanup: never   # as in ci.yml's check (#275)
      # Every finding is encrypted to the maintainer's age key (CONTRIBUTING §6), so the run checks the recipient before
      # it fuzzes: a run that could not record a finding does not start. age comes from the Ubuntu archive (signed by its
      # keys; 1.1.x on 24.04).
      - name: age and the recipient
        env:
          RECIPIENT: ${{ vars.FUZZ_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          # An X25519 recipient: age1 and 58 bech32 characters.
          if ! [[ $RECIPIENT =~ ^age1[qpzry9x8gf2tvdw0s3jn54khce6mua7l]{58}$ ]]; then
            echo "::error::the FUZZ_AGE_RECIPIENT repository variable is unset or not an age1… recipient (CONTRIBUTING §6)"
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends age
          age --version
      # The seed (#265): the seed job's fuzz-seed artifact, checked as data before any of it is used (fuzz_corpus.py
      # check: only directories of known targets, holding only regular files named by their SHA-1, within the -max_len
      # and the seed caps), then this target's units copied into the directory Jazzer loads and writes its generated
      # corpus to. A malformed artifact fails the job before it fuzzes. Without one the target starts from its committed
      # inputs.
      # A failed download falls back to the committed inputs; only a complete one is checked and used.
      - name: download the seed
        id: download-seed
        if: needs.seed.result == 'success' && needs.seed.outputs.units != '0'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fuzz-seed
          path: ${{ runner.temp }}/seed
      - name: seed
        if: steps.download-seed.outcome == 'success'
        env:
          TARGETS: ${{ needs.targets.outputs.targets }}
          NAME: ${{ matrix.target.name }}
          MODULE: ${{ matrix.target.module }}
          CLASS: ${{ matrix.target.class }}
          METHOD: ${{ matrix.target.method }}
        run: |
          set -euo pipefail
          seed=$RUNNER_TEMP/seed
          /usr/bin/env -i PATH=/usr/bin:/bin TARGETS="$TARGETS" /usr/bin/python3 -I .github/scripts/fuzz_corpus.py check "$seed"
          src=$seed/${NAME/./-}
          if [ ! -d "$src" ]; then echo "$NAME: no seed units"; exit 0; fi
          dest=$MODULE/.cifuzz-corpus/$CLASS/$METHOD
          mkdir -p "$dest"
          cp -R -- "$src/." "$dest/"
          echo "$NAME: seeded with $(find "$dest" -type f | wc -l) units from the corpus repository"
      # The §9.1 harness: -Xmx256m (the module's jvmTest sets it when JAZZER_FUZZ is set), -rss_limit_mb=1024, the
      # target's -timeout and -max_len. Jazzer's JUnit mode reads libFuzzer flags from the jazzer.internal.arg.<n>
      # configuration parameters, which reach the test JVM as system properties; they come after Jazzer's own
      # (-rss_limit_mb=0, -max_total_time from maxDuration), and libFuzzer keeps the last.
      # Job logs are public and libFuzzer prints a crashing input, so the Gradle output stays in $RUNNER_TEMP/fuzz-out and
      # the public log fails closed: only the lines before `> Task <project>:jvmTest` are printed, with workflow commands
      # stopped, nothing once the test-results XML exists or if those lines hold a fuzzer line, and the run counts.
      - name: fuzz
        id: fuzz
        env:
          FUZZ_SECONDS: ${{ inputs.seconds }}
          NAME: ${{ matrix.target.name }}
          PROJECT: ${{ matrix.target.project }}
          MODULE: ${{ matrix.target.module }}
          CLASS: ${{ matrix.target.class }}
          METHOD: ${{ matrix.target.method }}
          SOURCE: ${{ matrix.target.source }}
          MAX_LEN: ${{ matrix.target.maxLen }}
          TIMEOUT: ${{ matrix.target.timeout }}
        run: |
          set -euo pipefail
          # As the targets job checks: only [A-Za-z0-9._/-] in the name and source, before either is echoed.
          for value in "$NAME" "$SOURCE"; do
            case $value in ''|*[!A-Za-z0-9._/-]*) echo "::error::the target's name or source has a character outside [A-Za-z0-9._/-]"; exit 1 ;; esac
          done
          # Empty only without a dispatch (the nightly schedule); a dispatched 0 is rejected below.
          FUZZ_SECONDS=${FUZZ_SECONDS:-300}
          case $FUZZ_SECONDS in ''|*[!0-9]*) echo "::error::seconds must be a whole number"; exit 1 ;; esac
          if [ "$FUZZ_SECONDS" -lt 1 ] || [ "$FUZZ_SECONDS" -gt 3600 ]; then echo "::error::seconds must be 1 to 3600"; exit 1; fi
          args=(fake_argv0 "-max_total_time=$FUZZ_SECONDS" -rss_limit_mb=1024 "-timeout=$TIMEOUT")
          if [ -n "$MAX_LEN" ]; then
            args+=("-max_len=$MAX_LEN")
          else
            echo "::warning file=$SOURCE::$NAME: its source names no -max_len (spec §9.1: the cap + 1); libFuzzer's default applies"
          fi
          opts=""
          for i in "${!args[@]}"; do opts+=" -Djazzer.internal.arg.$i=${args[$i]}"; done
          echo "$NAME: ${args[*]:1}"
          out=$RUNNER_TEMP/fuzz-out
          mkdir -m 700 "$out"
          # Stale results would read as a test run that never happened.
          rm -rf "$MODULE/build/test-results/jvmTest"
          status=0
          JAZZER_FUZZ=1 JAVA_TOOL_OPTIONS="${opts# }" ./gradlew "$PROJECT:jvmTest" --tests "$CLASS.$METHOD" --rerun \
            -Prevokt.testJdk=25 -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64 --no-daemon \
            < /dev/null > "$out/gradle.log" 2>&1 || status=$?
          # Jazzer writes a finding (crash-, timeout-, oom-, leak-, slow-unit-) into the module directory, as these
          # targets keep their inputs under src/jvmTest/resources and not src/test/resources. libFuzzer names it by the
          # input's SHA-1, which gives a short input away, and harden-runner records process arguments. So each one is
          # copied to a numbered name, input-<n>-<kind>, through a redirection (no command sees the old name), and the
          # originals are removed by find, whose arguments hold only the patterns. From here on, no argument, log or
          # file name holds the hash.
          n=0
          for f in "$MODULE"/crash-* "$MODULE"/timeout-* "$MODULE"/oom-* "$MODULE"/leak-* "$MODULE"/slow-unit-*; do
            [ -f "$f" ] || continue
            base=${f##*/}
            case $base in slow-unit-*) kind=slow-unit ;; *) kind=${base%%-*} ;; esac
            n=$((n + 1))
            cat < "$f" > "$out/input-$n-$kind"
          done
          find "$MODULE" -maxdepth 1 -type f \( -name 'crash-*' -o -name 'timeout-*' -o -name 'oom-*' -o -name 'leak-*' \
            -o -name 'slow-unit-*' \) -delete
          cp "$MODULE/build/test-results/jvmTest/"*.xml "$out/" 2> /dev/null || true
          # The test task may have started (and with it the fuzzer) once its header is printed or its XML exists.
          started=0
          awk -v t="> Task $PROJECT:jvmTest" '$0 == t || index($0, t " ") == 1 { exit } { print }' "$out/gradle.log" > "$out/before-test.log"
          if [ "$(wc -l < "$out/before-test.log")" -lt "$(wc -l < "$out/gradle.log")" ] || ls "$out"/*.xml > /dev/null 2>&1; then started=1; fi
          if ls "$out"/*.xml > /dev/null 2>&1 || grep -qE 'Base64:|INFO: Seed:|^#[0-9]+[[:space:]]|==[0-9]+==' "$out/before-test.log"; then
            echo "(the Gradle log is withheld: the test task ran, and its output may hold a fuzz input)"
          else
            # The build's lines are not workflow commands: the runner ignores commands until the random end token.
            stop=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
            echo "::stop-commands::$stop"
            cat "$out/before-test.log"
            echo "::$stop::"
          fi
          rm -f "$out/before-test.log"
          grep -E '^Done [0-9]+ runs in [0-9]+ second' "$out/gradle.log" || true
          if [ "$status" -eq 0 ]; then exit 0; fi
          # A failure once the test task may have started is a finding, with or without a reproducer file.
          if [ "$started" -eq 1 ]; then
            echo "finding=true" >> "$GITHUB_OUTPUT"
            echo "::error file=$SOURCE::$NAME: a finding; it is uploaded encrypted to the maintainer's age key (CONTRIBUTING §6)"
          else
            echo "::error file=$SOURCE::$NAME: the build failed before fuzzing started"
          fi
          exit "$status"
      # libFuzzer's -minimize_crash=1 on each crash, timeout and oom input (the module's fuzzMinimize, at most 300 s each),
      # so it is small enough to triage; its output stays in $RUNNER_TEMP/fuzz-out, and the log shows only the counts.
      - name: minimise
        if: failure() && steps.fuzz.outputs.finding == 'true'
        env:
          PROJECT: ${{ matrix.target.project }}
          CLASS: ${{ matrix.target.class }}
          TIMEOUT: ${{ matrix.target.timeout }}
        run: |
          # No -e: a minimisation that fails or times out leaves the original input, and the next one still runs.
          set +e -uo pipefail
          out=$RUNNER_TEMP/fuzz-out
          inputs=0
          minimised=0
          for f in "$out"/input-*-crash "$out"/input-*-timeout "$out"/input-*-oom; do
            [ -f "$f" ] || continue
            base=${f##*/}
            inputs=$((inputs + 1))
            ./gradlew "$PROJECT:fuzzMinimize" -Prevokt.testJdk=25 -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64 \
              "-Prevokt.fuzzClass=$CLASS" "-Prevokt.fuzzInput=$f" "-Prevokt.fuzzOutput=$out/min-$base" \
              "-Prevokt.fuzzTimeout=$TIMEOUT" --no-daemon < /dev/null > "$out/minimise-$base.log" 2>&1
            if [ -s "$out/min-$base" ]; then minimised=$((minimised + 1)); fi
          done
          echo "minimised $minimised of $inputs finding inputs"
      # One sealed file per finding, so the advisory job can file it as text: a gzipped tar of the input, its minimised
      # form and minimiser log, the JUnit XML (its first 64 KiB) and the fuzzer log (its last 64 KiB), encrypted with
      # `age -a` (ASCII armour) to FUZZ_AGE_RECIPIENT. A stack trace can quote the input, so the traces are sealed too,
      # and a finding without an input file is sealed with the traces alone. The files are numbered, not named by
      # libFuzzer's crash-<sha1> (the fuzz step has already renamed them), as a hash of a short input gives the input
      # away; at most 8 per target.
      # manifest.json holds the target, its module, Jazzer's DEDUP_TOKEN (a hash of the finding's stack frames, empty
      # without one) and the file names. The log shows the target, the token and the count.
      - name: seal the finding
        id: seal
        if: failure() && steps.fuzz.outputs.finding == 'true'
        env:
          NAME: ${{ matrix.target.name }}
          MODULE: ${{ matrix.target.module }}
          RECIPIENT: ${{ vars.FUZZ_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          out=$RUNNER_TEMP/fuzz-out
          sealed=$RUNNER_TEMP/fuzz-sealed
          mkdir -m 700 "$sealed"
          # Jazzer's re-launched JVMs can outlive the minimiser's timeout and keep rewriting its output.
          pkill -KILL -u "$(id -un)" java || true
          token=$(cat "$out/gradle.log" "$out"/minimise-*.log 2> /dev/null | grep -oE 'DEDUP_TOKEN: [0-9a-f]{8,64}' | head -n 1 || true)
          token=${token#DEDUP_TOKEN: }
          inputs=()
          for f in "$out"/input-*; do
            if [ -f "$f" ]; then inputs+=("$f"); fi
          done
          if [ "${#inputs[@]}" -eq 0 ]; then inputs=(""); fi
          files=()
          n=0
          for f in "${inputs[@]:0:8}"; do
            n=$((n + 1))
            stage=$(mktemp -d "$RUNNER_TEMP/stage.XXXXXX")
            if [ -n "$f" ]; then
              base=${f##*/}
              cp "$f" "$stage/input"
              if [ -s "$out/min-$base" ]; then cp "$out/min-$base" "$stage/minimised"; fi
              if [ -f "$out/minimise-$base.log" ]; then tail -c 65536 "$out/minimise-$base.log" > "$stage/minimise.log"; fi
            fi
            k=0
            for x in "$out"/TEST-*.xml; do
              if [ -f "$x" ]; then k=$((k + 1)); head -c 65536 "$x" > "$stage/junit-$k.xml"; fi
            done
            if [ -f "$out/gradle.log" ]; then tail -c 65536 "$out/gradle.log" > "$stage/fuzz.log"; fi
            tar -C "$stage" -czf - . | age -a -r "$RECIPIENT" -o "$sealed/finding-$n.tar.age"
            rm -rf -- "${stage:?}"
            files+=("finding-$n.tar.age")
          done
          # module is a jq keyword, so the key is quoted and the variable named mod.
          jq -n --arg target "$NAME" --arg mod "$MODULE" --arg hash "$token" \
            '{"target": $target, "module": $mod, "hash": $hash, "files": $ARGS.positional}' --args "${files[@]}" \
            > "$sealed/manifest.json"
          echo "$NAME: finding ${token:-without a DEDUP_TOKEN}; $n sealed"
          echo "dir=$sealed" >> "$GITHUB_OUTPUT"
      # The armoured files and the manifest, kept 7 days: the advisory job's input, and the maintainer's fallback
      # (CONTRIBUTING §6). The run has already failed (the fuzz step's exit status).
      - name: upload the sealed finding
        if: failure() && steps.seal.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-finding-${{ matrix.target.name }}
          path: ${{ steps.seal.outputs.dir }}/
          if-no-files-found: error
          retention-days: 7
      # The seed's units are already in the corpus repository (a unit's name is its SHA-1), so only the new ones go up.
      - name: new corpus units only
        if: (github.event_name == 'schedule' || inputs.upload_corpus) && steps.fuzz.outcome == 'success'
        env:
          NAME: ${{ matrix.target.name }}
          MODULE: ${{ matrix.target.module }}
          CLASS: ${{ matrix.target.class }}
          METHOD: ${{ matrix.target.method }}
        run: |
          set -euo pipefail
          src=$RUNNER_TEMP/seed/${NAME/./-}
          dir=$MODULE/.cifuzz-corpus/$CLASS/$METHOD
          if [ ! -d "$dir" ]; then echo "$NAME: no generated corpus"; exit 0; fi
          if [ -d "$src" ]; then (cd "$src" && find . -maxdepth 1 -type f -print0) | (cd "$dir" && xargs -0 -r rm -f --); fi
          echo "$NAME: $(find "$dir" -type f | wc -l) new corpus units"
      # Jazzer's generated corpus, nightly or on request, and only from a run without a finding: the corpus job's input.
      # Merging it into the committed inputs stays a manual PR. An upload the account's storage quota refuses does not
      # fail the run (continue-on-error); the corpus job then finds no artifact and pushes nothing.
      - name: corpus
        if: (github.event_name == 'schedule' || inputs.upload_corpus) && steps.fuzz.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus-${{ matrix.target.name }}
          path: ${{ matrix.target.module }}/.cifuzz-corpus/${{ matrix.target.class }}/${{ matrix.target.method }}/
          if-no-files-found: warn
          retention-days: 1

  # A fresh runner that holds the advisory token and nothing of the fuzzed tree: no checkout of it, no Gradle, nothing
  # the fuzz job could have changed except the artifacts. It downloads the fuzz-finding-* artifacts, fetches only
  # fuzz_advisory.py at github.sha, and runs it under a clean environment with python3 -I. The script treats the
  # artifacts as hostile data and files at most 8 private draft advisories, one per new DEDUP_TOKEN (CONTRIBUTING §6).
  # The token lives in the fuzz-advisory environment, whose deployment branches are limited to main, and the job runs
  # only for a run of main (the nightly or a dispatch): a workflow or script changed on another branch never gets it.
  advisory:
    name: advisory (private drafts for new findings)
    needs: fuzz
    if: failure() && needs.fuzz.result == 'failure' && github.ref == 'refs/heads/main'
    environment: fuzz-advisory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      # No match (a fuzz job that failed without a finding) downloads nothing; the script then has nothing to file.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fuzz-finding-*
          path: ${{ runner.temp }}/findings
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/fuzz_advisory.py
          sparse-checkout-cone-mode: false
          path: advisory-script
      - name: file draft advisories
        env:
          # The fuzz-advisory environment's secret (CONTRIBUTING §6).
          GH_TOKEN: ${{ secrets.FUZZ_ADVISORY_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          FINDINGS: ${{ runner.temp }}/findings
          SCRIPT: ${{ github.workspace }}/advisory-script/.github/scripts/fuzz_advisory.py
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::the fuzz-advisory environment has no FUZZ_ADVISORY_TOKEN (CONTRIBUTING §6); decrypt the finding from the artifact"
            exit 1
          fi
          /usr/bin/env -i PATH=/usr/bin:/bin GH_TOKEN="$GH_TOKEN" REPO="$REPO" RUN_URL="$RUN_URL" RUN_ID="$RUN_ID" \
            /usr/bin/python3 -I "$SCRIPT" "$FINDINGS"

  # The corpus push (#213), on a fresh runner that never checks out, builds or runs anything of the repository: it
  # downloads the fuzz-corpus-* artifacts, checks them as data (a directory per known target, regular files only, each
  # named as libFuzzer names a corpus unit, the SHA-1 of its content in hex, and no larger than its target's -max_len, at most 5,000
  # files a target and 512 MiB in all), and adds them, never removing a unit, under corpus/<Class>-<method>/ in the
  # private geota/revokt-fuzz-corpus repository. Only this job holds CFL_CORPUS_TOKEN (contents write on that repository
  # only), through a credential helper that reads it from the environment, so it is in no command's arguments. It runs
  # for main only, and after a fuzz job that failed too: the targets that passed still uploaded their corpora.
  corpus:
    name: corpus (push to the private corpus repository)
    needs: [targets, fuzz]
    if: >-
      always() && needs.targets.result == 'success' && needs.targets.outputs.mode == 'fuzz' &&
      github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.upload_corpus)
    environment: fuzz-corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      # No match, or an artifact service that refuses (the storage quota), leaves nothing to push.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: fuzz-corpus-*
          path: ${{ runner.temp }}/corpus
      - name: check the corpus as data
        id: check
        env:
          TARGETS: ${{ needs.targets.outputs.targets }}
          CORPUS: ${{ runner.temp }}/corpus
          STAGED: ${{ runner.temp }}/staged
        run: |
          set -euo pipefail
          max_files=5000
          max_total=$((512 * 1024 * 1024))
          fail() { echo "::error::the corpus artifacts are malformed ($1); nothing is pushed"; exit 1; }
          mkdir -p "$STAGED/corpus"
          if [ ! -d "$CORPUS" ] || [ -z "$(ls -A "$CORPUS")" ]; then
            echo "::notice::no corpus artifact (no target passed, or the artifact storage refused the uploads)"
            echo "files=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=0
          total=0
          for dir in "$CORPUS"/* "$CORPUS"/.[!.]*; do
            [ -e "$dir" ] || continue
            if [ ! -d "$dir" ] || [ -L "$dir" ]; then fail "an entry that is not a directory"; fi
            base=${dir##*/}
            name=${base#fuzz-corpus-}
            [[ $base == fuzz-corpus-* && $name =~ ^[A-Za-z0-9_]+\.[A-Za-z0-9_]+$ ]] || fail "an artifact name"
            maxlen=$(jq -r --arg n "$name" '[.[] | select(.name == $n) | .maxLen // 16777217] | first // empty' <<< "$TARGETS")
            [[ $maxlen =~ ^[0-9]+$ ]] || fail "an artifact of no known target"
            if [ -n "$(find "$dir" -mindepth 1 ! -type f -print -quit)" ]; then fail "a nested directory or a link"; fi
            count=$(find "$dir" -mindepth 1 -type f | wc -l)
            [ "$count" -le "$max_files" ] || fail "more than $max_files units for one target"
            dest=$STAGED/corpus/${name/./-}
            mkdir -p "$dest"
            while IFS= read -r -d '' f; do
              unit=${f##*/}
              [[ $unit =~ ^[0-9a-f]{40}$ ]] || fail "a unit name"
              # libFuzzer names a unit by its SHA-1, so a unit already in the repository is never overwritten.
              [ "$(sha1sum < "$f" | cut -c1-40)" = "$unit" ] || fail "a unit whose name is not its SHA-1"
              size=$(stat -c %s -- "$f")
              [ "$size" -le "$maxlen" ] || fail "a unit over its target's -max_len"
              total=$((total + size))
              [ "$total" -le "$max_total" ] || fail "more than 512 MiB"
              cp -- "$f" "$dest/$unit"
              files=$((files + 1))
            done < <(find "$dir" -mindepth 1 -type f -print0)
          done
          echo "checked $files units, $total bytes"
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: push to geota/revokt-fuzz-corpus
        if: steps.check.outputs.files != '0'
        env:
          CFL_CORPUS_TOKEN: ${{ secrets.CFL_CORPUS_TOKEN }}
          STAGED: ${{ runner.temp }}/staged
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$CFL_CORPUS_TOKEN" ]; then
            echo "::error::no CFL_CORPUS_TOKEN secret; the corpus is not pushed"
            exit 1
          fi
          # The helper prints the token from the environment; the token itself is in no argument. It answers for
          # https://github.com only, and with git-lfs's downloads, pushes and hooks off nothing else is asked.
          # shellcheck disable=SC2016 # expanded by the helper's shell, not here
          helper='!f() { echo username=x-access-token; echo "password=$CFL_CORPUS_TOKEN"; }; f'
          repo=$RUNNER_TEMP/corpus-repo
          GIT_LFS_SKIP_SMUDGE=1 git -c core.hooksPath=/dev/null -c credential.https://github.com.helper="$helper" \
            clone --quiet --depth 1 https://github.com/geota/revokt-fuzz-corpus.git "$repo"
          mkdir -p "$repo/corpus"
          cp -R "$STAGED/corpus/." "$repo/corpus/"
          git -C "$repo" add corpus
          if git -C "$repo" diff --cached --quiet; then echo "no new corpus units"; exit 0; fi
          added=$(git -C "$repo" diff --cached --name-only | wc -l)
          git -C "$repo" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "corpus: $added new units from fuzz run $RUN_ID"
          GIT_LFS_SKIP_PUSH=1 git -C "$repo" -c core.hooksPath=/dev/null -c credential.https://github.com.helper="$helper" \
            push --quiet origin HEAD:main
          echo "pushed $added new corpus units"

  # The weekly prune's merge (#265), one job per target and secret-free, as the fuzz job is: it checks the seed job's
  # fuzz-seed artifact as data, merges this target's units into a fresh directory with libFuzzer's -merge=1 (the
  # module's fuzzMerge, in the §9.1 harness JVM), checks the result is a subset of what was read and uploads it, with
  # the list of its unit names, as the 1-day artifact fuzz-merged-<target> (units/<Class>-<method>/, lists/<Class>-<method>).
  # It reads under the prune's caps (fuzz_corpus.py --prune), higher than the seed's. The Gradle log stays in $RUNNER_TEMP, as a unit that crashes the target
  # would be in it; the log shows the lines before the task (as the fuzz job) and libFuzzer's MERGE-OUTER counts. A
  # merge that fails, needs more than one attempt (a unit crashed or timed out: the next nightly, seeded with the
  # corpus, files it as a finding) or keeps nothing uploads nothing, so the prune changes nothing for the target.
  merge:
    name: merge (${{ matrix.target.name }})
    needs: [targets, seed]
    if: >-
      !cancelled() && needs.targets.outputs.mode == 'prune' && needs.seed.result == 'success' &&
      needs.seed.outputs.units != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fuzz-seed
          path: ${{ runner.temp }}/seed
      - name: merge
        id: merge
        env:
          TARGETS: ${{ needs.targets.outputs.targets }}
          NAME: ${{ matrix.target.name }}
          PROJECT: ${{ matrix.target.project }}
          CLASS: ${{ matrix.target.class }}
          MAX_LEN: ${{ matrix.target.maxLen }}
          TIMEOUT: ${{ matrix.target.timeout }}
        run: |
          set -euo pipefail
          # As the targets job checks, before the name is echoed.
          case $NAME in ''|*[!A-Za-z0-9._]*) echo "::error::the target's name has a character outside [A-Za-z0-9._]"; exit 1 ;; esac
          seed=$RUNNER_TEMP/seed
          check() { /usr/bin/env -i PATH=/usr/bin:/bin TARGETS="$TARGETS" /usr/bin/python3 -I .github/scripts/fuzz_corpus.py check --prune "$@"; }
          check "$seed"
          src=$seed/${NAME/./-}
          if [ ! -d "$src" ]; then echo "$NAME: no corpus units; nothing to merge"; exit 0; fi
          before=$(find "$src" -type f | wc -l)
          out=$RUNNER_TEMP/merge-out
          mkdir -m 700 "$out"
          merged=$RUNNER_TEMP/merged/units/${NAME/./-}
          mkdir -p "$merged" "$RUNNER_TEMP/merged/lists"
          maxlen=()
          if [ -n "$MAX_LEN" ]; then maxlen=("-Prevokt.fuzzMaxLen=$MAX_LEN"); fi
          status=0
          ./gradlew "$PROJECT:fuzzMerge" -Prevokt.testJdk=25 -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64 \
            "-Prevokt.fuzzClass=$CLASS" "-Prevokt.fuzzCorpus=$src" "-Prevokt.fuzzMerged=$merged" \
            "-Prevokt.fuzzTimeout=$TIMEOUT" -Prevokt.fuzzBudget=3600 "${maxlen[@]}" --no-daemon < /dev/null > "$out/gradle.log" 2>&1 || status=$?
          pkill -KILL -u "$(id -un)" java || true
          awk -v t="> Task $PROJECT:fuzzMerge" '$0 == t || index($0, t " ") == 1 { exit } { print }' "$out/gradle.log" > "$out/before.log"
          if grep -qE 'Base64:|INFO: Seed:|^#[0-9]+[[:space:]]|==[0-9]+==|MERGE-' "$out/before.log"; then
            echo "(the Gradle log is withheld: it may hold a corpus unit)"
          else
            # The build's lines are not workflow commands: the runner ignores commands until the random end token.
            stop=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
            echo "::stop-commands::$stop"
            cat "$out/before.log"
            echo "::$stop::"
          fi
          # libFuzzer's own count lines: digits, words and punctuation only.
          grep -E '^MERGE-OUTER: [A-Za-z0-9 ,;()]+$' "$out/gradle.log" | awk '!seen[$0]++' || true
          after=$(find "$merged" -type f | wc -l)
          if [ "$status" -ne 0 ]; then
            echo "::error::$NAME: the merge failed (exit $status); its corpus is left unchanged"
            exit 1
          fi
          if ! grep -qxE 'MERGE-OUTER: successful in 1 attempt\(s\)' "$out/gradle.log"; then
            echo "::error::$NAME: the merge needed more than one attempt (a unit crashed or timed out); its corpus is left unchanged, and the next nightly files the crash"
            exit 1
          fi
          if [ "$after" -eq 0 ]; then
            echo "::error::$NAME: the merge kept no unit of $before; its corpus is left unchanged"
            exit 1
          fi
          check "$RUNNER_TEMP/merged/units" --within "$seed"
          # The unit list goes up with the units: the prune job takes only a download that matches it exactly.
          find "$merged" -type f -printf '%f\n' | sort > "$RUNNER_TEMP/merged/lists/${NAME/./-}"
          echo "$NAME: $before units merged to $after"
          echo "units=$after" >> "$GITHUB_OUTPUT"
      - name: upload the merged corpus
        if: steps.merge.outputs.units != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-merged-${{ matrix.target.name }}
          path: ${{ runner.temp }}/merged/
          if-no-files-found: error
          retention-days: 1

  # The weekly prune's write (#265), on a fresh runner that never checks out, builds or runs anything of the repository
  # but fuzz_corpus.py, fetched alone at github.sha. It downloads the fuzz-merged-* artifacts, clones the corpus
  # repository with CFL_CORPUS_TOKEN (the corpus job's secret, in the fuzz-corpus environment) and goes on only if the
  # repository is still at the commit the seed job read. It checks each merged corpus as data and as a subset of the
  # target's directory there (a merge only selects units, so the prune can remove units but never add one), replaces
  # each merged target's directory with its merged corpus, and pushes one commit. A target without a merged corpus is
  # left as it is. A merge job that failed leaves its target unchanged, and the others are still pruned. A download
  # that fails fails the job, and one that does not match the merge jobs' unit lists exactly is rejected, so neither
  # changes anything. A target the seed job left out (over the prune's caps, or every unit over its -max_len) fails the
  # run once the rest is pushed.
  prune:
    name: prune (write the merged corpus to the private corpus repository)
    needs: [targets, seed, merge]
    if: >-
      !cancelled() && needs.targets.outputs.mode == 'prune' && needs.seed.result == 'success' &&
      (needs.seed.outputs.units != '0' || needs.seed.outputs.over_caps == 'true') && github.ref == 'refs/heads/main'
    environment: fuzz-corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block   # a token-holding job: GitHub's git, API and artifact hosts only
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      # No match (every merge failed or kept nothing) succeeds with nothing to prune. Any other failure fails the job
      # before the clone, so a partial download is never pruned from.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fuzz-merged-*
          path: ${{ runner.temp }}/merged
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/fuzz_corpus.py
          sparse-checkout-cone-mode: false
          path: corpus-script
      - name: clone geota/revokt-fuzz-corpus
        id: clone
        env:
          CFL_CORPUS_TOKEN: ${{ secrets.CFL_CORPUS_TOKEN }}
          COMMIT: ${{ needs.seed.outputs.commit }}
          MERGED: ${{ runner.temp }}/merged
        run: |
          set -euo pipefail
          if [ ! -d "$MERGED/units" ] || [ -z "$(ls -A "$MERGED/units")" ]; then echo "::notice::no merged corpus; nothing is pruned"; exit 0; fi
          if [ -z "$CFL_CORPUS_TOKEN" ]; then
            echo "::error::no CFL_CORPUS_TOKEN secret; the corpus is not pruned"
            exit 1
          fi
          # shellcheck disable=SC2016 # expanded by the helper's shell, not here
          helper='!f() { echo username=x-access-token; echo "password=$CFL_CORPUS_TOKEN"; }; f'
          repo=$RUNNER_TEMP/corpus-repo
          GIT_LFS_SKIP_SMUDGE=1 git -c core.hooksPath=/dev/null -c credential.https://github.com.helper="$helper" \
            clone --quiet --depth 1 https://github.com/geota/revokt-fuzz-corpus.git "$repo"
          head=$(git -C "$repo" rev-parse HEAD)
          if [ "$head" != "$COMMIT" ]; then
            echo "::warning::the corpus repository moved since the seed job read it ($COMMIT, now $head); nothing is pruned"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: check the merged corpus as data
        if: steps.clone.outputs.ready == 'true'
        env:
          TARGETS: ${{ needs.targets.outputs.targets }}
          MERGED: ${{ runner.temp }}/merged
          SCRIPT: ${{ github.workspace }}/corpus-script/.github/scripts/fuzz_corpus.py
        run: |
          set -euo pipefail
          /usr/bin/env -i PATH=/usr/bin:/bin TARGETS="$TARGETS" /usr/bin/python3 -I "$SCRIPT" check --prune "$MERGED/units" \
            --within "$RUNNER_TEMP/corpus-repo/corpus" --lists "$MERGED/lists"
      - name: push to geota/revokt-fuzz-corpus
        if: steps.clone.outputs.ready == 'true'
        env:
          CFL_CORPUS_TOKEN: ${{ secrets.CFL_CORPUS_TOKEN }}
          MERGED: ${{ runner.temp }}/merged
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # expanded by the helper's shell, not here
          helper='!f() { echo username=x-access-token; echo "password=$CFL_CORPUS_TOKEN"; }; f'
          repo=$RUNNER_TEMP/corpus-repo
          targets=0
          for dir in "$MERGED"/units/*/; do
            name=$(basename "$dir")
            # The check step allowed only current targets' directory names.
            [[ $name =~ ^[A-Za-z0-9_]+-[A-Za-z0-9_]+$ ]] || { echo "::error::a merged directory name"; exit 1; }
            git -C "$repo" rm -r -q -- "corpus/$name"
            mkdir -p "$repo/corpus/$name"
            cp -R -- "$dir." "$repo/corpus/$name/"
            git -C "$repo" add -- "corpus/$name"
            targets=$((targets + 1))
          done
          # A merge only selects units: a staged addition means the check above was bypassed.
          if [ -n "$(git -C "$repo" diff --cached --name-only --diff-filter=ACMRT)" ]; then
            echo "::error::the prune would add or change a corpus unit; nothing is pushed"
            exit 1
          fi
          if git -C "$repo" diff --cached --quiet; then echo "nothing to prune"; exit 0; fi
          removed=$(git -C "$repo" diff --cached --name-only | wc -l)
          git -C "$repo" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "corpus: prune $removed units of $targets targets (fuzz run $RUN_ID, -merge=1)"
          GIT_LFS_SKIP_PUSH=1 git -C "$repo" -c core.hooksPath=/dev/null -c credential.https://github.com.helper="$helper" \
            push --quiet origin HEAD:main
          echo "pruned $removed units of $targets targets"
      - name: targets the prune left out
        if: ${{ !cancelled() && needs.seed.outputs.over_caps == 'true' }}
        run: |
          echo "::error::a target's corpus is over the prune's caps, or every unit is over its -max_len (the seed job's log names it); trim it by hand (CONTRIBUTING §6)"
          exit 1
