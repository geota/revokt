#
# The PR tier (CONTRIBUTING §6): `check` on the JDK matrix, `ci-extras`, `static`, `coverage`. Every job is a required
# status check (Appendix B). Nightly and release live in their own workflows.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, "release/*"]

permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # Gradle always runs on 21; the matrix JDK is the test launcher (`-Prevokt.testJdk`).
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  check:
    name: check (${{ matrix.label }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { jdk: "17", label: "17" }
          - { jdk: "21", label: "21" }
          - { jdk: "25", label: "lts" }
          - { jdk: "27", label: "feature" }
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit   # switched to `block` once the warm-up job and cache restore exist (CONTRIBUTING §6)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each feature release at its latest patch, the one users run: a runner's cached patch can lag (17.0.20.1
      # re-encodes the SPKI of an algorithm it does not know, such as ML-DSA, with NULL parameters; 17.0.21 knows
      # ML-DSA). This resolves through api.adoptium.net and downloads from github.com, which the harden-runner policy
      # must allow once it blocks egress.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          check-latest: true
          java-version: |
            ${{ matrix.jdk }}
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          validate-wrappers: true
      # The large corpus (docs/dev/corpus.md): the revokt-corpus tag gradle/corpus-pin.properties pins, cached by the pin;
      # verifyCorpusManifest checks it against the pinned manifest hash.
      - name: the revokt-corpus pin
        id: corpus
        run: |
          tag=$(sed -n 's/^tag=//p' gradle/corpus-pin.properties)
          # A v* tag, the ones the corpus repository's ruleset makes immutable; the manifest hash is the integrity check.
          case $tag in v[0-9]|v[0-9]*[0-9]) ;; *) echo "::error::bad tag in gradle/corpus-pin.properties"; exit 1 ;; esac
          case $tag in v*[!0-9.]*|*..*) echo "::error::bad tag in gradle/corpus-pin.properties"; exit 1 ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: corpus-cache
        with:
          path: build/corpus
          key: revokt-corpus-${{ steps.corpus.outputs.tag }}-${{ hashFiles('gradle/corpus-pin.properties') }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        with:
          repository: geota/revokt-corpus
          ref: refs/tags/${{ steps.corpus.outputs.tag }}
          path: build/corpus
          persist-credentials: false
      - name: check
        run: >
          ./gradlew check
          -Prevokt.corpus=build/corpus
          -Prevokt.testJdk=${{ matrix.jdk }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64,JAVA_HOME_27_X64
          --no-daemon
      - name: test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.label }}-${{ github.run_attempt }}
          path: |
            */build/test-results/**/*.xml
            build-logic/*/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: coverage artifact (JDK 21 only)
        if: matrix.jdk == '21'
        run: ./gradlew koverXmlReport --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.jdk == '21'
        with:
          name: coverage-${{ github.sha }}
          path: build/reports/kover/report.xml
          if-no-files-found: error
          retention-days: 14
      - name: baseline for the coverage gate (main only)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.jdk == '21' && github.ref == 'refs/heads/main'
        with:
          name: coverage-main
          path: build/reports/kover/report.xml
          overwrite: true
          retention-days: 90

  check-os:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-15
          - os: windows
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: check (engine and clubcard only; file locking and ATOMIC_MOVE paths)
        run: ./gradlew :revokt-engine:check :revokt-clubcard:check --no-daemon

  ci-extras:
    name: ci-extras
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: purity compile, consumers (Android modules from 0.3)
        run: ./gradlew check -Prevokt.ci --no-daemon

  static:
    name: static
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: reuse lint
        run: pipx run reuse==6.2.0 lint
      - name: actionlint (download script pinned by commit)
        run: |
          curl -sSfL -o download-actionlint.bash https://raw.githubusercontent.com/rhysd/actionlint/03d0035246f3e81f36aed592ffb4bebf33a03106/scripts/download-actionlint.bash
          bash download-actionlint.bash 1.7.7
          ./actionlint -color

  labeler:
    name: labeler
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true

  dependency-submission:
    name: dependency-submission (main; feeds dependency review and the graph)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

  coverage:
    name: coverage
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-${{ github.sha }}
          path: pr-coverage
      - name: compare with main (not below; 90 % target by 0.2)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/coverage_compare.py pr-coverage/report.xml
