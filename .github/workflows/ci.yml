# SPDX-License-Identifier: Apache-2.0
#
# The PR tier (CONTRIBUTING §6): `check` on the JDK matrix, `ci-extras`, `static`. Every job is a required status check
# (Appendix B). Coverage is the Kover per-package floors inside `check` (#212); no check depends on an uploaded
# artifact. Nightly and release live in their own workflows.
#
# A PR that changes only documentation (`changes` below) skips the JDK and OS matrix: `check-docs` reports the same
# check names instead, and ci-extras runs only the spec inventory (specStatusCheck), so the required checks still
# report (#211). Anything else, a push, or a `changes` job that did not finish runs everything.
#
# The Linux test jobs block egress except to the hosts their setup needs (GitHub and its Actions cache and artifact
# storage, Adoptium, the Gradle distribution and plugin portal, Maven Central, Google's Maven, and for the
# Kotlin/Native compile JetBrains' downloads); a test can reach loopback and those hosts, nothing else, and
# NoHttpClientInTests is the second line. A blocked endpoint fails the job and harden-runner annotates it; add a host
# only for a build step, never for a test (CONTRIBUTING §6). The two allow-lists below are copies: keep them equal.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, "release/*"]

permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # Gradle always runs on 21; the matrix JDK is the test launcher (`-Prevokt.testJdk`).
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  changes:
    name: changes (documentation only?)
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - name: does the PR change anything but documentation?
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$PR" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi   # a push runs everything
          # Every path changed between the event's base and head (so a later push cannot change the answer), and the old
          # path of a rename. Documentation is a Markdown file outside a source set and the corpus, or a file under
          # docs/ that is not a script (verifyHeaderLocations reads *.py and *.sh); the spec and docs/dev/status.md
          # stay covered by specStatusCheck.
          compare=$(gh api "repos/$REPO/compare/$BASE...$HEAD")
          files=$(jq -r '.files[]? | .filename, (.previous_filename // empty)' <<< "$compare")
          listed=$(jq '.files // [] | length' <<< "$compare")
          code=false
          if [ -z "$files" ] || [ "$listed" != "$CHANGED" ]; then code=true; fi   # a truncated or empty list runs everything
          while IFS= read -r f; do
            case $f in
              corpus/*|src/*|*/src/*|*.py|*.sh) code=true ;;
              docs/*|*.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  check:
    name: check (${{ matrix.label }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { jdk: "17", label: "17" }
          - { jdk: "21", label: "21" }
          - { jdk: "25", label: "lts" }
          - { jdk: "27", label: "feature" }
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block   # the allow-list is the setup's hosts (header)
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.adoptium.net:443
            services.gradle.org:443
            downloads.gradle.org:443
            plugins.gradle.org:443
            plugins-artifacts.gradle.org:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            dl.google.com:443
            maven.google.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each feature release at its latest patch, the one users run: a runner's cached patch can lag (17.0.20.1
      # re-encodes the SPKI of an algorithm it does not know, such as ML-DSA, with NULL parameters; 17.0.21 knows
      # ML-DSA). This resolves through api.adoptium.net and downloads from github.com, which the harden-runner policy
      # allows.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          check-latest: true
          java-version: |
            ${{ matrix.jdk }}
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          validate-wrappers: true
      # The large corpus (docs/dev/corpus.md): the revokt-corpus tag gradle/corpus-pin.properties pins, cached by the pin;
      # verifyCorpusManifest checks it against the pinned manifest hash.
      - name: the revokt-corpus pin
        id: corpus
        run: |
          tag=$(sed -n 's/^tag=//p' gradle/corpus-pin.properties)
          # A v* tag, the ones the corpus repository's ruleset makes immutable; the manifest hash is the integrity check.
          case $tag in v[0-9]|v[0-9]*[0-9]) ;; *) echo "::error::bad tag in gradle/corpus-pin.properties"; exit 1 ;; esac
          case $tag in v*[!0-9.]*|*..*) echo "::error::bad tag in gradle/corpus-pin.properties"; exit 1 ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: corpus-cache
        with:
          path: build/corpus
          key: revokt-corpus-${{ steps.corpus.outputs.tag }}-${{ hashFiles('gradle/corpus-pin.properties') }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        with:
          repository: geota/revokt-corpus
          ref: refs/tags/${{ steps.corpus.outputs.tag }}
          path: build/corpus
          persist-credentials: false
      - name: diag (temporary, #275)
        run: >
          .github/scripts/diag-275.sh check
          -Prevokt.corpus=build/corpus
          -Prevokt.testJdk=${{ matrix.jdk }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64,JAVA_HOME_27_X64
      - name: check
        run: >
          ./gradlew check
          -Prevokt.corpus=build/corpus
          -Prevokt.testJdk=${{ matrix.jdk }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64,JAVA_HOME_27_X64
          --no-daemon
      - name: test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.label }}-${{ github.run_attempt }}
          path: |
            */build/test-results/**/*.xml
            build-logic/*/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
      # The HTML report Gradle writes when dependency verification fails says why each artifact failed (a missing
      # signature file, a key not found, a checksum missing or wrong), which the console message does not (#275).
      - name: dependency verification report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-verification-${{ matrix.label }}-${{ github.run_attempt }}
          path: |
            build/reports/dependency-verification/
            build-logic/build/reports/dependency-verification/
            build-logic/*/build/reports/dependency-verification/
          if-no-files-found: ignore
          retention-days: 7

  check-os:
    name: check (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-15
          - os: windows
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      # Saved from main like the Linux jobs' caches (#257): read-only everywhere, these two resolved the whole graph from
      # Maven Central and the plugin portal on every push, which is what put the project under the rate limit.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: check (engine, jsse and clubcard only; file locking and ATOMIC_MOVE paths)
        run: ./gradlew :revokt-engine:check :revokt-jsse:check :revokt-clubcard:check --no-daemon

  # The pass-through for a documentation-only PR: the same check names as check and check-os, reporting success
  # (#211). Keep its labels equal to theirs.
  check-docs:
    name: check (${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        label: ["17", "21", "lts", "feature", "macos", "windows"]
    steps:
      - run: echo "Documentation only; the JDK and OS matrix has nothing to test (CONTRIBUTING §6)."

  ci-extras:
    name: ci-extras
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block   # as `check`, plus JetBrains' downloads for the Kotlin/Native compile
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.adoptium.net:443
            services.gradle.org:443
            downloads.gradle.org:443
            plugins.gradle.org:443
            plugins-artifacts.gradle.org:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            dl.google.com:443
            maven.google.com:443
            download.jetbrains.com:443
            download-cdn.jetbrains.com:443
            cache-redirector.jetbrains.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # The Rule fixture's growability check (spec §4, #73) compares with the PR's base, or on main with the commit before.
      # `check` enforces it from 0.3 on (#211); the base is passed either way.
      - name: fetch the growability base
        if: needs.changes.outputs.code != 'false'
        id: base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
            echo "property=-Prevokt.growabilityBase=$BASE" >> "$GITHUB_OUTPUT"
          fi
      - name: purity compile, consumers (Android modules from 0.3)
        if: needs.changes.outputs.code != 'false'
        env:
          GROWABILITY_BASE: ${{ steps.base.outputs.property }}
        run: ./gradlew check -Prevokt.ci ${GROWABILITY_BASE:+"$GROWABILITY_BASE"} --no-daemon
      - name: documentation only; the spec inventory (docs/dev/status.md fresh, the fixture count not lower)
        if: needs.changes.outputs.code == 'false'
        run: ./gradlew specStatusCheck --no-daemon

  static:
    name: static
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: reuse lint
        run: pipx run reuse==6.2.0 lint
      - name: actionlint (download script pinned by commit)
        run: |
          curl -sSfL -o download-actionlint.bash https://raw.githubusercontent.com/rhysd/actionlint/03d0035246f3e81f36aed592ffb4bebf33a03106/scripts/download-actionlint.bash
          bash download-actionlint.bash 1.7.7
          ./actionlint -color
      # fuzz.yml's own checks (#115): plain shellcheck over its jobs' run blocks, as actionlint's built-in run does not
      # report every check (it let an unassigned variable, SC2154, through), and the unit tests of fuzz_advisory.py's
      # handling of hostile artifacts. shellcheck is the runner image's, as actionlint's own is.
      - name: fuzz.yml's shellcheck and fuzz_advisory.py's tests
        run: |
          shellcheck --version
          python3 .github/scripts/fuzz_shellcheck.py .github/workflows/fuzz.yml fuzz
          python3 .github/scripts/fuzz_shellcheck.py .github/workflows/fuzz.yml advisory
          python3 .github/scripts/fuzz_shellcheck.py .github/workflows/fuzz.yml corpus
          python3 -I -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: pr_lint.js's body rules (#210)
        run: node .github/scripts/test_pr_lint.js

  labeler:
    name: labeler
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true

  dependency-submission:
    name: dependency-submission (main; feeds dependency review and the graph)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
