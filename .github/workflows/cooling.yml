#
# cooling (CONTRIBUTING §8): 24 h between the last push and merge on data/seed/**, the release workflows and
# **/verify/** (every protected path in the solo-maintainer phase). Reports success at once for other PRs, and a
# schedule re-runs it so a pending PR turns green without a push. Advisory fixes and reverts are exempt.
name: cooling

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  cooling:
    name: cooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}   # the policy comes from the base branch
          persist-credentials: false
          sparse-checkout: |
            MAINTAINERS.md
            .github/protected-paths.txt
            .github/scripts/cooling.js
          sparse-checkout-cone-mode: false
      - name: policy files from the base branch (fallback to the PR head only when the base has none, i.e. the bootstrap)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for f in MAINTAINERS.md .github/protected-paths.txt .github/scripts/cooling.js; do [ -f "$f" ] || missing=1; done
          if [ "$missing" = 1 ]; then
            echo "::warning::base branch carries no policy files (bootstrap PR); taking them from the PR head $HEAD_SHA"
            git fetch --depth 1 origin "$HEAD_SHA"
            git checkout FETCH_HEAD -- MAINTAINERS.md .github/protected-paths.txt .github/scripts/cooling.js
          fi
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const script = fs.readFileSync('.github/scripts/cooling.js', 'utf8');
            await eval(`(async () => { ${script} })()`);
