#
# Mutation testing (#215, docs/dev/mutation-testing.md): Pitest over the JVM classes of revokt-engine's critical
# packages, on dispatch and weekly. Never on pull_request and never a gate: the run succeeds whatever survives, and the
# surviving mutants are the job summary (a lead for a test, or an equivalent mutant) and a 14-day artifact.
name: pitest

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      packages:
        description: "revokt-engine packages, comma-separated (default update,store,fetch,verify,walker)"
        required: false
        default: "update,store,fetch,verify,walker"

permissions: read-all

concurrency:
  group: pitest
  cancel-in-progress: false

jobs:
  pitest:
    name: pitest (revokt-engine)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}   # saved from main, read elsewhere (#262)
      - name: pitestJvm
        env:
          PACKAGES: ${{ inputs.packages || 'update,store,fetch,verify,walker' }}
        run: |
          set -euo pipefail
          case $PACKAGES in *[!a-z,]*|'') echo "::error::packages must be lower-case names separated by commas"; exit 1 ;; esac
          ./gradlew :revokt-engine:pitestJvm "-Prevokt.pitest.packages=$PACKAGES" --no-configuration-cache
      - name: summary
        if: always()
        run: |
          set -euo pipefail
          report=revokt-engine/build/reports/pitest/mutations.xml
          if [ -f "$report" ]; then
            python3 .github/scripts/pitest_summary.py "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Pitest report: see the pitestJvm step." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pitest-report
          path: revokt-engine/build/reports/pitest/
          retention-days: 14
          if-no-files-found: ignore
