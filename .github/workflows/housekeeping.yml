#
# stale drafts (exempt: blocked), /claim on issues, the weekly owner-power audit trail (the live rulesets and settings
# against docs/dev/rulesets/, an issue on a difference). CONTRIBUTING §2, §5, §7.
name: housekeeping

on:
  schedule:
    - cron: "7 4 * * *"
    - cron: "11 5 * * 1"
  issue_comment:
    types: [created]
  workflow_dispatch:   # the rulesets audit on demand

permissions: read-all

jobs:
  stale:
    name: stale
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-pr-stale: 30
          days-before-pr-close: 7
          days-before-issue-stale: -1
          only-pr-labels: ""
          exempt-pr-labels: "blocked"
          exempt-draft-pr: false
          stale-pr-label: "stale"
          stale-pr-message: "This draft has been idle for 30 days (CONTRIBUTING §5). It closes in 7 days unless labelled `blocked` or updated; the branch stays."

  claim:
    name: claim
    if: github.event_name == 'issue_comment' && !github.event.issue.pull_request && startsWith(github.event.comment.body, '/claim')
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            if (issue.assignees && issue.assignees.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `Already claimed by @${issue.assignees[0].login} (one assignee per issue, CONTRIBUTING §2).` });
              return;
            }
            await github.rest.issues.addAssignees({ owner, repo, issue_number: issue.number, assignees: [context.payload.comment.user.login] });

  # The owner-power audit trail (CONTRIBUTING §7, #241): the live rulesets, environments and merge settings against
  # the committed docs/dev/rulesets/. On a difference it opens, or rewrites, one issue holding the diff, which
  # github.token may do (a PR it may not: "Actions may not create or approve pull requests"), and closes the issue once
  # the files match again; the committed files change in an ordinary PR. The rulesets' bypass list is readable only
  # with RULESETS_AUDIT_TOKEN (a fine-grained token with Administration: read on this repository, kept in the audit
  # environment), and so are most merge settings. rulesets_compare.sh leaves a member out only where the live export
  # lacks it or holds null, and names each one, so a member the token can read is always compared.
  rulesets-audit:
    name: rulesets-audit
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && github.event.schedule == '11 5 * * 1') || github.event_name == 'workflow_dispatch')
    # Where RULESETS_AUDIT_TOKEN lives once the maintainer sets it, with deployments limited to main.
    environment: audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write   # the one audit issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: export and compare
        env:
          GH_TOKEN: ${{ secrets.RULESETS_AUDIT_TOKEN || github.token }}
          NEWS: ${{ runner.temp }}/audit.md
        run: |
          set -euo pipefail
          bash .github/scripts/rulesets_export.sh "$RUNNER_TEMP/live"
          bash .github/scripts/rulesets_compare.sh docs/dev/rulesets "$RUNNER_TEMP/live" "$NEWS"
      - name: open, update or close the audit issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEWS: ${{ runner.temp }}/audit.md
          TITLE: "chore(repo): the live rulesets differ from docs/dev/rulesets"
          LABELS: area/repo,kind/chore
          INTRO: "The weekly owner-power audit (`.github/workflows/housekeeping.yml`, CONTRIBUTING §7) found:"
          OUTRO: "The audit rewrites this issue every Monday while the difference holds and closes it once the files match."
          CLOSE_NOTE: "The live settings match docs/dev/rulesets again"
        run: bash .github/scripts/release_watch.sh "$NEWS"
