#
# The nightly fuzzing tier (spec §9.1 "Tiers", §9.2 "Tiers and matrix"; CONTRIBUTING §6; #119): ClusterFuzzLite batch
# fuzzing, one matrix job per Jazzer @FuzzTest method that `./gradlew fuzzTargets` lists, on GitHub-hosted runners.
# Runs on the schedule and when a maintainer dispatches it; never on pull_request or pull_request_target.
# ClusterFuzzLite's build and run images run by digest through .clusterfuzzlite/cflite.sh, not through its actions,
# which on GitHub publish fuzzer logs (with crashing inputs) to the job log and crashes as public artifacts; that
# script's header says what it keeps private and how. The corpus lives in the private storage repository
# (CFL_CORPUS_TOKEN), and the fuzz job holds no other secret. A finding is sealed with age to FUZZ_AGE_RECIPIENT and
# uploaded with a manifest as the 7-day artifact fuzz-finding-<target>, the format fuzz.yml uses, and the advisory job
# files one private draft security advisory per new finding with fuzz_advisory.py, as fuzz.yml's does.
name: cflite-batch

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "all, or one target as Class.method (the targets job lists them)"
        type: string
        default: all
      seconds:
        description: "Fuzzing time per target, in seconds (60 to 7200)"
        type: number
        default: 3600

permissions: read-all

# One run at a time: two runs would race on the storage repository and on recording the same finding. A second run
# waits for the first, and a third replaces the waiting second.
concurrency:
  group: cflite-batch
  cancel-in-progress: false

env:
  # ClusterFuzzLite's images (google/clusterfuzzlite's actions use their :v1 tags), pinned by digest; bump them by hand.
  BUILD_IMAGE: gcr.io/oss-fuzz-base/clusterfuzzlite-build-fuzzers@sha256:766c550e0d679fef093876e222f4e4ee2277551b9aaeb7e9a92759a63cc1518e
  RUN_IMAGE: gcr.io/oss-fuzz-base/clusterfuzzlite-run-fuzzers@sha256:9e195c0a560b5c2af6c88d17a39be403bcc9af09adbde02df2779de59d838a75
  CORPUS_REPO: geota/revokt-fuzz-corpus

jobs:
  targets:
    name: targets (the @FuzzTest methods)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      # build-logic's FuzzTargets, as fuzz.yml's targets job; the -max_len check is the ClusterFuzzLite build's.
      - name: list
        id: list
        env:
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          set -euo pipefail
          case $TARGET in ''|*[!A-Za-z0-9_.]*) echo "::error::target must be all or Class.method"; exit 1 ;; esac
          stop=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
          echo "::stop-commands::$stop"
          status=0
          ./gradlew fuzzTargets --no-daemon || status=$?
          echo "::$stop::"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          targets=$(jq -c --arg t "$TARGET" '[.[] | select($t == "all" or .name == $t)]' build/fuzz/targets.json)
          if [ "$targets" = "[]" ]; then echo "::error::no target named $TARGET (see the fuzzTargets output above)"; exit 1; fi
          # The batch job echoes each target's name, module and source into workflow commands and paths, so they may
          # hold only [A-Za-z0-9._/-]; \A and \z anchor the whole string.
          if ! jq -e 'all(.[]; all(.name, .module, .source; type == "string" and test("\\A[A-Za-z0-9._/-]+\\z")))' <<< "$targets" > /dev/null; then
            echo "::error::a target's name, module or source has a character outside [A-Za-z0-9._/-]; nothing is fuzzed"
            exit 1
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  batch:
    name: batch (${{ matrix.target.name }})
    needs: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # As fuzz.yml: a run that could not seal a finding does not start. age comes from the Ubuntu archive.
      - name: age and the recipient
        env:
          RECIPIENT: ${{ vars.FUZZ_AGE_RECIPIENT }}
          NAME: ${{ matrix.target.name }}
          MODULE: ${{ matrix.target.module }}
          FUZZ_SECONDS: ${{ inputs.seconds }}
        run: |
          set -euo pipefail
          for value in "$NAME" "$MODULE"; do
            case $value in ''|*[!A-Za-z0-9._/-]*) echo "::error::the target's name or module has a character outside [A-Za-z0-9._/-]"; exit 1 ;; esac
          done
          # Empty on the schedule; a dispatched value out of range is rejected.
          FUZZ_SECONDS=${FUZZ_SECONDS:-3600}
          case $FUZZ_SECONDS in ''|*[!0-9]*) echo "::error::seconds must be a whole number"; exit 1 ;; esac
          if [ "$FUZZ_SECONDS" -lt 60 ] || [ "$FUZZ_SECONDS" -gt 7200 ]; then echo "::error::seconds must be 60 to 7200"; exit 1; fi
          if ! [[ $RECIPIENT =~ ^age1[qpzry9x8gf2tvdw0s3jn54khce6mua7l]{58}$ ]]; then
            echo "::error::the FUZZ_AGE_RECIPIENT repository variable is unset or not an age1… recipient (CONTRIBUTING §6)"
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends age
          age --version
          .clusterfuzzlite/cflite.sh prepare
          echo "FUZZ_SECONDS=$FUZZ_SECONDS" >> "$GITHUB_ENV"
          # ClusterFuzzLite's target name: Class-method (cflite_build.py).
          echo "BINARY=${NAME//./-}" >> "$GITHUB_ENV"
      - name: corpus in
        env:
          CFL_CORPUS_TOKEN: ${{ secrets.CFL_CORPUS_TOKEN }}
        run: |
          set -euo pipefail
          .clusterfuzzlite/cflite.sh clone main "$RUNNER_TEMP/cflite/corpus" "/corpus/$BINARY/"
          .clusterfuzzlite/cflite.sh corpus-in "$RUNNER_TEMP/cflite/corpus" "$BINARY"
      - name: build
        env:
          NAME: ${{ matrix.target.name }}
        run: |
          .clusterfuzzlite/cflite.sh build address "$NAME"
      - name: fuzz
        id: fuzz
        run: |
          .clusterfuzzlite/cflite.sh run batch address "$FUZZ_SECONDS"
      # The corpus grows from every run that fuzzed (with or without a finding), but only for a run of main.
      - name: corpus out
        if: always() && (steps.fuzz.outputs.status == '0' || steps.fuzz.outputs.status == '2') && github.ref == 'refs/heads/main'
        env:
          CFL_CORPUS_TOKEN: ${{ secrets.CFL_CORPUS_TOKEN }}
          NAME: ${{ matrix.target.name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          .clusterfuzzlite/cflite.sh corpus-out "$RUNNER_TEMP/cflite/corpus" "$BINARY"
          .clusterfuzzlite/cflite.sh push "$RUNNER_TEMP/cflite/corpus" main "corpus: batch $NAME, run $RUN_ID"
      - name: seal the finding
        id: seal
        if: failure() && steps.fuzz.outputs.status == '2'
        env:
          NAME: ${{ matrix.target.name }}
          MODULE: ${{ matrix.target.module }}
          RECIPIENT: ${{ vars.FUZZ_AGE_RECIPIENT }}
        run: |
          .clusterfuzzlite/cflite.sh seal-finding "$NAME" "$MODULE" "$BINARY" address
      # The armoured files and the manifest, kept 7 days: the advisory job's input, and the maintainer's fallback.
      - name: upload the sealed finding
        if: failure() && steps.seal.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-finding-${{ matrix.target.name }}
          path: ${{ steps.seal.outputs.dir }}/
          if-no-files-found: error
          retention-days: 7
      # A ClusterFuzzLite error after the run started: its log, sealed, for the maintainer (not a finding).
      - name: seal the log
        id: seal-log
        if: failure() && steps.fuzz.outputs.status != '' && steps.fuzz.outputs.status != '0' && steps.fuzz.outputs.status != '2'
        env:
          RECIPIENT: ${{ vars.FUZZ_AGE_RECIPIENT }}
        run: |
          .clusterfuzzlite/cflite.sh seal-log
      - name: upload the sealed log
        if: failure() && steps.seal-log.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cflite-log-${{ matrix.target.name }}
          path: ${{ steps.seal-log.outputs.dir }}/
          if-no-files-found: error
          retention-days: 7

  # As fuzz.yml's advisory job: a fresh runner with FUZZ_ADVISORY_TOKEN and nothing of the fuzzed tree; it downloads the
  # fuzz-finding-* artifacts, fetches only fuzz_advisory.py at github.sha, and files at most 8 private draft advisories,
  # one per new DEDUP_TOKEN. The token lives in the fuzz-advisory environment (deployment branches: main), and the job
  # runs only for main.
  advisory:
    name: advisory (private drafts for new findings)
    needs: batch
    if: failure() && needs.batch.result == 'failure' && github.ref == 'refs/heads/main'
    environment: fuzz-advisory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fuzz-finding-*
          path: ${{ runner.temp }}/findings
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/fuzz_advisory.py
          sparse-checkout-cone-mode: false
          path: advisory-script
      - name: file draft advisories
        env:
          GH_TOKEN: ${{ secrets.FUZZ_ADVISORY_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          FINDINGS: ${{ runner.temp }}/findings
          SCRIPT: ${{ github.workspace }}/advisory-script/.github/scripts/fuzz_advisory.py
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::the fuzz-advisory environment has no FUZZ_ADVISORY_TOKEN (CONTRIBUTING §6); decrypt the finding from the artifact"
            exit 1
          fi
          /usr/bin/env -i PATH=/usr/bin:/bin GH_TOKEN="$GH_TOKEN" REPO="$REPO" RUN_URL="$RUN_URL" RUN_ID="$RUN_ID" \
            /usr/bin/python3 -I "$SCRIPT" "$FINDINGS"
